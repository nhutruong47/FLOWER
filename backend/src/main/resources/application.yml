spring:
  application:
    name: flowerchain-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowerchain}
    username: ${SPRING_DATASOURCE_USERNAME:flowerchain}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowerchain:
  security:
    cors-allowed-origins: ${FLOWERCHAIN_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  payment:
    webhook-secret: ${FLOWERCHAIN_PAYMENT_WEBHOOK_SECRET:dev-only-placeholder-webhook-secret-change-in-env}
