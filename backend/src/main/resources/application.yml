spring:
  application:
    name: flowerchain-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowerchain}
    username: ${SPRING_DATASOURCE_USERNAME:flowerchain}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    # Spring Boot 4 / Jackson 3: keep the Jackson 2 defaults Boot 3 used (missing primitives stay 0 or reach
    # Bean Validation, trailing tokens are ignored) so API behaviour is unchanged by the upgrade (TASK-015).
    use-jackson2-defaults: true
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Boot 4 turns liveness/readiness probes on by default; keep Boot 3 behaviour until hosting (T6) is decided.
      probes:
        enabled: false

flowerchain:
  security:
    cors-allowed-origins: ${FLOWERCHAIN_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  payment:
    sandbox-hmac:
      # Sandbox payment provider adapter (ADR-0007). OFF unless explicitly enabled; when off, 'sandbox-hmac'
      # webhooks are rejected like any unsupported provider. Never enable it in production (TASK-017 review F2).
      enabled: ${FLOWERCHAIN_PAYMENT_SANDBOX_HMAC_ENABLED:false}
      # Fails closed: a blank, placeholder or shorter-than-32-character secret rejects every webhook (503).
      webhook-secret: ${FLOWERCHAIN_PAYMENT_SANDBOX_HMAC_WEBHOOK_SECRET:dev-only-placeholder-webhook-secret-change-in-env}
